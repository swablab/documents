name: deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: deploy
    runs-on: docker
    steps:
      - name: checkout
        uses: https://data.forgejo.org/actions/checkout@v7

      - name: compile
        uses: ./.forgejo/typst

      - name: upload
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: documents
          path: "*.pdf"
          if-no-files-found: error
          retention-days: 7
